<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CapySouls — The Rodent of Despair</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0705;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'IM Fell English', serif;
    color: #c9a96e;
    overflow: hidden;
  }

  #title-screen {
    position: absolute;
    inset: 0;
    background: #0a0705;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 18px;
  }

  #title-screen h1 {
    font-family: 'Cinzel', serif;
    font-size: 3.2rem;
    color: #c9a96e;
    text-shadow: 0 0 40px #a0622066, 0 2px 8px #000;
    letter-spacing: 6px;
    text-align: center;
  }

  #title-screen .sub {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: #7a6040;
    letter-spacing: 2px;
  }

  #title-screen .controls-hint {
    margin-top: 10px;
    font-size: 0.85rem;
    color: #5a4a30;
    text-align: center;
    line-height: 1.9;
  }

  #start-btn {
    margin-top: 10px;
    padding: 12px 44px;
    background: transparent;
    border: 1px solid #c9a96e55;
    color: #c9a96e;
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
  }
  #start-btn:hover {
    background: #c9a96e18;
    border-color: #c9a96e;
    box-shadow: 0 0 20px #c9a96e33;
  }

  #game-wrap {
    position: relative;
    display: none;
  }

  canvas {
    display: block;
    image-rendering: pixelated;
    border: 1px solid #2a1f10;
    box-shadow: 0 0 60px #00000088, inset 0 0 40px #00000044;
  }

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 12px 16px;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 220px;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .bar-label {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 2px;
    width: 16px;
    color: #9a7850;
    text-shadow: 0 1px 4px #000;
  }

  .bar-bg {
    flex: 1;
    height: 10px;
    background: #1a1208cc;
    border: 1px solid #3a2a1588;
    position: relative;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    transition: width 0.12s ease;
    position: relative;
  }

  #hp-fill { background: linear-gradient(90deg, #8b1a1a, #c0392b); }
  #st-fill { background: linear-gradient(90deg, #1a5c2a, #27ae60); }

  #message-box {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Cinzel', serif;
    font-size: 1.05rem;
    letter-spacing: 3px;
    color: #c9a96e;
    text-shadow: 0 0 20px #c9a96e88, 0 2px 6px #000;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
    white-space: nowrap;
    text-align: center;
  }

  #you-died {
    position: absolute;
    inset: 0;
    background: #00000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s;
    z-index: 50;
  }

  #you-died h2 {
    font-family: 'Cinzel', serif;
    font-size: 3.5rem;
    color: #8b1a1a;
    letter-spacing: 10px;
    text-shadow: 0 0 40px #8b1a1a88;
  }

  #you-died .retry {
    margin-top: 20px;
    font-size: 0.8rem;
    color: #5a3a3a;
    letter-spacing: 3px;
    pointer-events: all;
    cursor: pointer;
  }
  #you-died .retry:hover { color: #c9a96e; }

  #victory {
    position: absolute;
    inset: 0;
    background: #00000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s;
    z-index: 50;
  }
  #victory h2 {
    font-family: 'Cinzel', serif;
    font-size: 2.5rem;
    color: #c9a96e;
    letter-spacing: 6px;
    text-shadow: 0 0 40px #c9a96e88;
  }
  #victory .sub2 {
    margin-top: 10px;
    font-size: 0.9rem;
    color: #7a6040;
    font-style: italic;
    letter-spacing: 2px;
  }

  .controls-panel {
    position: absolute;
    bottom: 10px;
    right: 10px;
    font-size: 0.62rem;
    color: #4a3820;
    line-height: 1.7;
    text-align: right;
    pointer-events: none;
    font-family: 'IM Fell English', serif;
  }
</style>
</head>
<body>

<div id="title-screen">
  <h1>CAPYSOULS</h1>
  <div class="sub">— The Rodent of Despair —</div>
  <div class="controls-hint">
    WASD / Arrow Keys — Move<br>
    J / Z — Attack<br>
    K / X — Dodge Roll<br>
    Survive. Or don't.
  </div>
  <button id="start-btn" onclick="startGame()">BEGIN SUFFERING</button>
</div>

<div id="game-wrap">
  <canvas id="canvas" width="800" height="500"></canvas>
  <div id="hud">
    <div class="bar-row">
      <div class="bar-label">HP</div>
      <div class="bar-bg"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
    </div>
    <div class="bar-row">
      <div class="bar-label">ST</div>
      <div class="bar-bg"><div class="bar-fill" id="st-fill" style="width:100%"></div></div>
    </div>
  </div>
  <div id="message-box"></div>
  <div id="you-died">
    <h2>YOU DIED</h2>
    <div class="retry" onclick="restartGame()">PRESS TO TRY AGAIN</div>
  </div>
  <div id="victory">
    <h2>ENEMY FELLED</h2>
    <div class="sub2">The capybara endures. As always.</div>
  </div>
  <div class="controls-panel">
    WASD · Move &nbsp;|&nbsp; J/Z · Attack &nbsp;|&nbsp; K/X · Dodge
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Palette ──────────────────────────────────────────────
const PAL = {
  ground:   '#1c140d',
  tile1:    '#201810',
  tile2:    '#241c12',
  wall:     '#0f0b07',
  wallTop:  '#2a1f12',
  player:   '#c9a96e',
  playerShadow: '#8b6b3a',
  sword:    '#e8e0c8',
  enemy:    '#5a3a6e',
  enemyDark:'#3a204e',
  enemyEye: '#ff4444',
  hpRed:    '#c0392b',
  stGreen:  '#27ae60',
  dmgColor: '#ff6644',
  healColor:'#44ff88',
  rollColor:'#88ccff',
};

// ── State ─────────────────────────────────────────────────
let keys = {};
let gameState = 'playing'; // playing | dead | victory
let frameCount = 0;
let particles = [];
let shakeTimer = 0;
let shakeAmt = 0;
let msgTimer = 0;

// ── Player ────────────────────────────────────────────────
let player;
function makePlayer() {
  return {
    x: 200, y: 250,
    w: 32, h: 28,
    vx: 0, vy: 0,
    speed: 3.2,
    hp: 100, maxHp: 100,
    stamina: 100, maxStamina: 100,
    staminaRegen: 0.22,
    staminaDrain: 28,
    attackCooldown: 0,
    attackDuration: 0,
    rollCooldown: 0,
    rollDuration: 0,
    rollDir: {x:0,y:0},
    rollSpeed: 8,
    isRolling: false,
    isAttacking: false,
    facing: 1, // 1=right, -1=left
    facingY: 0,
    invincible: 0,
    hitFlash: 0,
    dead: false,
  };
}

// ── Enemies ───────────────────────────────────────────────
let enemies = [];
function makeEnemy(x, y, type) {
  const configs = {
    grunt: { hp: 60, maxHp: 60, speed: 1.2, attackRange: 40, attackDmg: 12, attackRate: 90, size: 30, aggro: 280, name: 'HOLLOW GRUNT' },
    brute: { hp: 180, maxHp: 180, speed: 0.7, attackRange: 52, attackDmg: 25, attackRate: 130, size: 42, aggro: 340, name: 'FORSAKEN BRUTE' },
    fast:  { hp: 35,  maxHp: 35,  speed: 2.2, attackRange: 34, attackDmg: 8,  attackRate: 50,  size: 24, aggro: 320, name: 'WRAITH SHADE' },
  };
  const c = configs[type] || configs.grunt;
  return {
    x, y, type,
    w: c.size, h: c.size * 0.85,
    vx: 0, vy: 0,
    ...c,
    state: 'idle', // idle | chase | attack | stagger | dead
    attackTimer: 0,
    staggerTimer: 0,
    wanderAngle: Math.random() * Math.PI * 2,
    wanderTimer: 0,
    hitFlash: 0,
    dead: false,
    id: Math.random(),
  };
}

// ── Room layout ───────────────────────────────────────────
const WALL_T = 60; // top wall height
const WALL_B = 60; // bottom
const WALL_S = 50; // sides
const FLOOR_COLOR = '#1a1208';

// ── Init ──────────────────────────────────────────────────
function initLevel() {
  player = makePlayer();
  enemies = [
    makeEnemy(560, 200, 'grunt'),
    makeEnemy(650, 310, 'grunt'),
    makeEnemy(500, 360, 'fast'),
    makeEnemy(680, 150, 'brute'),
  ];
  particles = [];
  gameState = 'playing';
  document.getElementById('you-died').style.opacity = '0';
  document.getElementById('you-died').style.pointerEvents = 'none';
  document.getElementById('victory').style.opacity = '0';
  document.getElementById('victory').style.pointerEvents = 'none';
}

// ── Input ─────────────────────────────────────────────────
document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
document.addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

function isKey(...ks) { return ks.some(k => keys[k]); }

// ── Stamina ───────────────────────────────────────────────
function drainStamina(amt) {
  player.stamina = Math.max(0, player.stamina - amt);
}
function regenStamina() {
  if (!player.isRolling && !player.isAttacking) {
    player.stamina = Math.min(player.maxStamina, player.stamina + player.staminaRegen);
  }
}

// ── Combat ────────────────────────────────────────────────
function playerAttack() {
  if (player.attackCooldown > 0 || player.isRolling) return;
  if (player.stamina < 20) { showMessage('NOT ENOUGH STAMINA'); return; }
  drainStamina(20);
  player.isAttacking = true;
  player.attackDuration = 22;
  player.attackCooldown = 40;

  // Check hits
  const reach = 52;
  const ax = player.x + player.w/2 + player.facing * (player.w/2 + 10);
  const ay = player.y + player.h/2 + (player.facingY || 0) * 14;

  enemies.forEach(e => {
    if (e.dead) return;
    const ex = e.x + e.w/2, ey = e.y + e.h/2;
    const dist = Math.hypot(ax - ex, ay - ey);
    if (dist < reach + e.w/2) {
      const dmg = 18 + Math.floor(Math.random() * 8);
      e.hp -= dmg;
      e.hitFlash = 10;
      e.staggerTimer = 20;
      e.state = 'stagger';
      spawnDmgParticles(ex, ey, dmg, PAL.dmgColor);
      screenShake(3, 6);
      if (e.hp <= 0) killEnemy(e);
    }
  });
}

function playerRoll() {
  if (player.rollCooldown > 0 || player.isRolling) return;
  if (player.stamina < 30) { showMessage('NOT ENOUGH STAMINA'); return; }
  drainStamina(30);
  const dx = (isKey('d','arrowright') ? 1 : isKey('a','arrowleft') ? -1 : player.facing);
  const dy = (isKey('s','arrowdown') ? 1 : isKey('w','arrowup') ? -1 : 0);
  const len = Math.hypot(dx, dy) || 1;
  player.rollDir = { x: dx/len, y: dy/len };
  player.isRolling = true;
  player.rollDuration = 18;
  player.rollCooldown = 45;
  player.invincible = 22;
  spawnTrail(player.x + player.w/2, player.y + player.h/2, PAL.rollColor);
}

function killEnemy(e) {
  e.dead = true;
  e.state = 'dead';
  spawnDeathParticles(e.x + e.w/2, e.y + e.h/2, PAL.enemy, 20);
  screenShake(5, 12);
  showMessage(e.name + ' DEFEATED');
  if (enemies.every(en => en.dead)) {
    setTimeout(() => {
      gameState = 'victory';
      const v = document.getElementById('victory');
      v.style.opacity = '1';
      v.style.pointerEvents = 'all';
    }, 800);
  }
}

function enemyHitPlayer(e) {
  if (player.invincible > 0 || player.dead) return;
  player.hp -= e.attackDmg;
  player.hitFlash = 16;
  player.invincible = 35;
  spawnDmgParticles(player.x + player.w/2, player.y + player.h/2, e.attackDmg, PAL.hpRed);
  screenShake(4, 8);
  if (player.hp <= 0) killPlayer();
}

function killPlayer() {
  player.dead = true;
  player.hp = 0;
  gameState = 'dead';
  spawnDeathParticles(player.x + player.w/2, player.y + player.h/2, PAL.player, 30);
  setTimeout(() => {
    const d = document.getElementById('you-died');
    d.style.opacity = '1';
    d.style.pointerEvents = 'all';
  }, 800);
}

// ── Particles ─────────────────────────────────────────────
function spawnDmgParticles(x, y, dmg, color) {
  for (let i = 0; i < 8; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 28 + Math.random() * 15,
      maxLife: 28 + 15,
      color,
      size: 2 + Math.random() * 3,
      type: 'spark',
    });
  }
  // damage number
  particles.push({
    x, y: y - 10,
    vx: (Math.random() - 0.5) * 0.8,
    vy: -1.2,
    life: 40,
    maxLife: 40,
    text: '-' + dmg,
    color,
    type: 'text',
    size: 13,
  });
}

function spawnDeathParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 40 + Math.random() * 30,
      maxLife: 70,
      color,
      size: 3 + Math.random() * 5,
      type: 'spark',
      gravity: 0.1,
    });
  }
}

function spawnTrail(x, y, color) {
  particles.push({
    x, y,
    vx: 0, vy: 0,
    life: 12, maxLife: 12,
    color,
    size: 8,
    type: 'glow',
  });
}

// ── Screen shake ──────────────────────────────────────────
function screenShake(amt, dur) {
  shakeAmt = amt;
  shakeTimer = dur;
}

// ── HUD ───────────────────────────────────────────────────
let lastHp = 100, lastSt = 100;
function updateHUD() {
  const hpPct = Math.max(0, player.hp / player.maxHp) * 100;
  const stPct = Math.max(0, player.stamina / player.maxStamina) * 100;
  if (hpPct !== lastHp) {
    document.getElementById('hp-fill').style.width = hpPct + '%';
    lastHp = hpPct;
  }
  if (stPct !== lastSt) {
    document.getElementById('st-fill').style.width = stPct + '%';
    lastSt = stPct;
  }
}

let msgTimeoutId = null;
function showMessage(text) {
  const el = document.getElementById('message-box');
  el.textContent = text;
  el.style.opacity = '1';
  if (msgTimeoutId) clearTimeout(msgTimeoutId);
  msgTimeoutId = setTimeout(() => { el.style.opacity = '0'; }, 2200);
}

// ── Collision ─────────────────────────────────────────────
function clampToArena(obj) {
  obj.x = Math.max(WALL_S, Math.min(W - WALL_S - obj.w, obj.x));
  obj.y = Math.max(WALL_T, Math.min(H - WALL_B - obj.h, obj.y));
}

function rectsOverlap(a, b, pad = 0) {
  return a.x < b.x + b.w + pad &&
         a.x + a.w + pad > b.x &&
         a.y < b.y + b.h + pad &&
         a.y + a.h + pad > b.y;
}

// ── Update ────────────────────────────────────────────────
function update() {
  if (gameState !== 'playing') return;
  frameCount++;

  // Screen shake
  if (shakeTimer > 0) shakeTimer--;

  // Player input
  if (!player.dead) {
    let mx = 0, my = 0;
    if (isKey('a','arrowleft'))  mx -= 1;
    if (isKey('d','arrowright')) mx += 1;
    if (isKey('w','arrowup'))    my -= 1;
    if (isKey('s','arrowdown'))  my += 1;

    if (mx !== 0) player.facing = mx;
    if (mx !== 0 || my !== 0) player.facingY = my;

    // Normalise diagonal
    if (mx && my) { mx *= 0.707; my *= 0.707; }

    // Attack / Roll input
    if ((keys['j'] || keys['z']) && !player.isAttacking) playerAttack();
    if ((keys['k'] || keys['x']) && !player.isRolling)   playerRoll();

    // Apply movement
    if (player.isRolling) {
      player.vx = player.rollDir.x * player.rollSpeed;
      player.vy = player.rollDir.y * player.rollSpeed;
      player.rollDuration--;
      if (player.rollDuration <= 0) { player.isRolling = false; }
    } else if (!player.isAttacking) {
      player.vx = mx * player.speed;
      player.vy = my * player.speed;
    } else {
      player.vx *= 0.6;
      player.vy *= 0.6;
    }

    player.x += player.vx;
    player.y += player.vy;
    clampToArena(player);

    // Timers
    if (player.attackCooldown > 0) player.attackCooldown--;
    if (player.attackDuration > 0) { player.attackDuration--; if (player.attackDuration <= 0) player.isAttacking = false; }
    if (player.rollCooldown > 0) player.rollCooldown--;
    if (player.invincible > 0) player.invincible--;
    if (player.hitFlash > 0) player.hitFlash--;

    regenStamina();
  }

  // Enemy AI
  enemies.forEach(e => {
    if (e.dead) return;
    const pdx = (player.x + player.w/2) - (e.x + e.w/2);
    const pdy = (player.y + player.h/2) - (e.y + e.h/2);
    const dist = Math.hypot(pdx, pdy);

    if (e.hitFlash > 0) e.hitFlash--;

    switch (e.state) {
      case 'idle':
        // Wander
        e.wanderTimer--;
        if (e.wanderTimer <= 0) {
          e.wanderAngle += (Math.random() - 0.5) * 1.5;
          e.wanderTimer = 40 + Math.random() * 60;
        }
        e.vx += Math.cos(e.wanderAngle) * 0.08;
        e.vy += Math.sin(e.wanderAngle) * 0.08;
        e.vx *= 0.85;
        e.vy *= 0.85;
        // Aggro check
        if (dist < e.aggro && !player.dead) e.state = 'chase';
        break;

      case 'chase':
        if (dist > e.aggro + 80) { e.state = 'idle'; break; }
        if (dist < e.attackRange) { e.state = 'attack'; e.attackTimer = 0; break; }
        if (!player.dead) {
          const speed = e.speed;
          e.vx = (pdx / dist) * speed;
          e.vy = (pdy / dist) * speed;
        }
        break;

      case 'attack':
        e.vx *= 0.5;
        e.vy *= 0.5;
        e.attackTimer++;
        if (e.attackTimer >= e.attackRate) {
          e.attackTimer = 0;
          if (dist < e.attackRange + 8) {
            enemyHitPlayer(e);
          }
        }
        if (dist > e.attackRange + 20) e.state = 'chase';
        break;

      case 'stagger':
        e.staggerTimer--;
        e.vx *= 0.7;
        e.vy *= 0.7;
        if (e.staggerTimer <= 0) e.state = 'chase';
        break;
    }

    e.x += e.vx;
    e.y += e.vy;
    clampToArena(e);

    // Enemy-enemy separation
    enemies.forEach(other => {
      if (other === e || other.dead) return;
      const dx2 = e.x - other.x, dy2 = e.y - other.y;
      const d2 = Math.hypot(dx2, dy2);
      const minD = (e.w + other.w) / 2 - 5;
      if (d2 < minD && d2 > 0) {
        const push = (minD - d2) / d2 * 0.5;
        e.x += dx2 * push;
        e.y += dy2 * push;
      }
    });
  });

  // Particles
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.gravity) p.vy += p.gravity;
    p.vx *= 0.93;
    if (!p.gravity) p.vy *= 0.93;
    p.life--;
    return p.life > 0;
  });

  updateHUD();
}

// ── Drawing helpers ───────────────────────────────────────

function drawArena() {
  // Floor tiles
  const tileSize = 50;
  for (let tx = WALL_S; tx < W - WALL_S; tx += tileSize) {
    for (let ty = WALL_T; ty < H - WALL_B; ty += tileSize) {
      const col = ((Math.floor(tx/tileSize) + Math.floor(ty/tileSize)) % 2 === 0) ? PAL.tile1 : PAL.tile2;
      ctx.fillStyle = col;
      ctx.fillRect(tx, ty, tileSize, tileSize);
    }
  }

  // Subtle floor grid lines
  ctx.strokeStyle = '#ffffff08';
  ctx.lineWidth = 1;
  for (let tx = WALL_S; tx <= W - WALL_S; tx += tileSize) {
    ctx.beginPath(); ctx.moveTo(tx, WALL_T); ctx.lineTo(tx, H - WALL_B); ctx.stroke();
  }
  for (let ty = WALL_T; ty <= H - WALL_B; ty += tileSize) {
    ctx.beginPath(); ctx.moveTo(WALL_S, ty); ctx.lineTo(W - WALL_S, ty); ctx.stroke();
  }

  // Walls
  ctx.fillStyle = PAL.wall;
  ctx.fillRect(0, 0, W, WALL_T); // top
  ctx.fillRect(0, H - WALL_B, W, WALL_B); // bottom
  ctx.fillRect(0, 0, WALL_S, H); // left
  ctx.fillRect(W - WALL_S, 0, WALL_S, H); // right

  // Wall detail
  ctx.fillStyle = PAL.wallTop;
  ctx.fillRect(WALL_S, WALL_T - 8, W - WALL_S * 2, 4);
  ctx.fillRect(WALL_S, H - WALL_B + 4, W - WALL_S * 2, 4);
  ctx.fillRect(WALL_S - 8, WALL_T, 4, H - WALL_T - WALL_B);
  ctx.fillRect(W - WALL_S + 4, WALL_T, 4, H - WALL_T - WALL_B);

  // Corner torches (decorative dots)
  drawTorch(WALL_S + 30, WALL_T + 20);
  drawTorch(W - WALL_S - 30, WALL_T + 20);
  drawTorch(WALL_S + 30, H - WALL_B - 20);
  drawTorch(W - WALL_S - 30, H - WALL_B - 20);
}

function drawTorch(x, y) {
  const flicker = Math.sin(frameCount * 0.18 + x) * 3;
  // glow
  const grad = ctx.createRadialGradient(x, y, 0, x, y, 30 + flicker);
  grad.addColorStop(0, '#ff990055');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, 30 + flicker, 0, Math.PI * 2);
  ctx.fill();
  // dot
  ctx.fillStyle = '#ffcc44';
  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawShadow(x, y, w) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + w * 0.85, w * 0.4, w * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawCapybara(p) {
  if (p.dead) return;
  const x = p.x, y = p.y, w = p.w, h = p.h;
  const cx = x + w/2, cy = y + h/2;
  const f = p.facing;

  // Shadow
  drawShadow(x, y, w);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(f, 1);

  // Roll shimmer
  if (p.isRolling) {
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = PAL.rollColor;
    ctx.beginPath();
    ctx.ellipse(0, 0, w * 0.65, h * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Hit flash
  if (p.hitFlash > 0 && Math.floor(p.hitFlash / 3) % 2 === 0) {
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.ellipse(0, 0, w * 0.7, h * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Body (rounded rectangle-ish)
  ctx.fillStyle = p.hitFlash > 0 ? '#e0b080' : '#c9a06a';
  ctx.beginPath();
  ctx.ellipse(0, 2, w * 0.48, h * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();

  // Darker back / shading
  ctx.fillStyle = '#a07848';
  ctx.beginPath();
  ctx.ellipse(-4, 4, w * 0.3, h * 0.3, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.fillStyle = '#d4a870';
  ctx.beginPath();
  ctx.ellipse(w * 0.32, -h * 0.08, w * 0.26, h * 0.25, 0, 0, Math.PI * 2);
  ctx.fill();

  // Snout (capybara characteristic flat nose)
  ctx.fillStyle = '#b88850';
  ctx.beginPath();
  ctx.ellipse(w * 0.48, h * 0.02, w * 0.14, h * 0.15, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eye
  ctx.fillStyle = '#1a0f00';
  ctx.beginPath();
  ctx.arc(w * 0.38, -h * 0.14, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(w * 0.37, -h * 0.15, 1, 0, Math.PI * 2);
  ctx.fill();

  // Ear
  ctx.fillStyle = '#b88850';
  ctx.beginPath();
  ctx.arc(w * 0.24, -h * 0.3, 5, 0, Math.PI * 2);
  ctx.fill();

  // Legs (4 small bumps)
  ctx.fillStyle = '#a07040';
  const legY = h * 0.38;
  [-w*0.28, -w*0.08, w*0.1, w*0.28].forEach(lx => {
    ctx.beginPath();
    const bob = p.isRolling ? 0 : Math.sin(frameCount * 0.25 + lx) * 2;
    ctx.ellipse(lx, legY + bob, 5, 7, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  // Tiny tail
  ctx.fillStyle = '#b88850';
  ctx.beginPath();
  ctx.arc(-w * 0.46, 0, 4, 0, Math.PI * 2);
  ctx.fill();

  // Sword
  if (p.isAttacking || p.attackCooldown > 25) {
    ctx.save();
    const swingAng = p.isAttacking ? -0.8 + (1 - p.attackDuration / 22) * 2.2 : 0.8;
    ctx.rotate(swingAng);
    // Blade
    ctx.fillStyle = PAL.sword;
    ctx.fillRect(w * 0.28, -4, 28, 5);
    // Guard
    ctx.fillStyle = '#9a8860';
    ctx.fillRect(w * 0.24, -7, 6, 11);
    // Handle
    ctx.fillStyle = '#6a4820';
    ctx.fillRect(w * 0.1, -3, 13, 4);
    // Glint
    if (p.isAttacking) {
      ctx.fillStyle = '#ffffffcc';
      ctx.fillRect(w * 0.32, -3, 10, 2);
    }
    ctx.restore();
  }

  ctx.restore();
}

function drawEnemy(e) {
  if (e.dead) return;
  const x = e.x, y = e.y, w = e.w, h = e.h;
  const cx = x + w/2, cy = y + h/2;
  const f = (player.x < e.x) ? -1 : 1;

  drawShadow(x, y, w);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(f, 1);

  const flash = e.hitFlash > 0 && Math.floor(e.hitFlash / 2) % 2 === 0;

  // Body
  ctx.fillStyle = flash ? '#cc88ff' : (e.type === 'brute' ? '#4a2a5e' : e.type === 'fast' ? '#3a2848' : '#5a3a6e');
  ctx.beginPath();
  ctx.ellipse(0, 0, w * 0.42, h * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();

  // Robe / cloak
  ctx.fillStyle = flash ? '#aa66ee' : (e.type === 'brute' ? '#2a1a3e' : '#3a2050');
  ctx.beginPath();
  ctx.moveTo(-w * 0.4, 0);
  ctx.lineTo(w * 0.4, 0);
  ctx.lineTo(w * 0.28, h * 0.55);
  ctx.lineTo(-w * 0.28, h * 0.55);
  ctx.closePath();
  ctx.fill();

  // Head
  ctx.fillStyle = flash ? '#bb77ff' : '#6a4480';
  ctx.beginPath();
  ctx.arc(0, -h * 0.22, w * 0.24, 0, Math.PI * 2);
  ctx.fill();

  // Eyes (glowing red)
  const eyePulse = 0.7 + Math.sin(frameCount * 0.1 + e.id * 10) * 0.3;
  ctx.fillStyle = `rgba(255,${Math.floor(eyePulse * 40)},${Math.floor(eyePulse * 40)},${eyePulse})`;
  ctx.beginPath();
  ctx.arc(-w * 0.08, -h * 0.24, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(w * 0.08, -h * 0.24, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // Weapon
  if (e.type === 'brute') {
    // Big axe
    ctx.fillStyle = '#888888';
    ctx.fillRect(w * 0.28, -h * 0.4, 6, h * 0.8);
    ctx.fillStyle = '#aaaaaa';
    ctx.beginPath();
    ctx.moveTo(w * 0.34, -h * 0.4);
    ctx.lineTo(w * 0.34 + 18, -h * 0.15);
    ctx.lineTo(w * 0.34, h * 0.0);
    ctx.closePath();
    ctx.fill();
  } else if (e.type === 'fast') {
    // Dagger
    ctx.fillStyle = '#cccccc';
    const dang = Math.sin(frameCount * 0.2 + e.id) * 0.3;
    ctx.save();
    ctx.rotate(dang);
    ctx.fillRect(w * 0.22, -4, 20, 3);
    ctx.restore();
  } else {
    // Short sword
    ctx.fillStyle = '#aaaaaa';
    ctx.fillRect(w * 0.24, -3, 22, 4);
    ctx.fillStyle = '#888844';
    ctx.fillRect(w * 0.2, -6, 5, 9);
  }

  // Attack charge indicator
  if (e.state === 'attack') {
    const charge = e.attackTimer / e.attackRate;
    ctx.strokeStyle = `rgba(255,100,50,${charge * 0.8})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, w * 0.5 + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * charge);
    ctx.stroke();
  }

  ctx.restore();

  // Health bar above enemy
  drawEnemyHP(e);

  // Name tag (when damaged)
  if (e.hitFlash > 0) {
    ctx.fillStyle = '#c9a96e';
    ctx.font = '500 9px "Cinzel", serif';
    ctx.textAlign = 'center';
    ctx.fillText(e.name, e.x + e.w / 2, e.y - 22);
  }
}

function drawEnemyHP(e) {
  const bw = e.w + 10;
  const bx = e.x + e.w/2 - bw/2;
  const by = e.y - 16;
  // bg
  ctx.fillStyle = '#1a1208cc';
  ctx.fillRect(bx, by, bw, 6);
  // fill
  const pct = Math.max(0, e.hp / e.maxHp);
  const hpColor = pct > 0.5 ? PAL.hpRed : pct > 0.25 ? '#ff6600' : '#ff2200';
  ctx.fillStyle = hpColor;
  ctx.fillRect(bx, by, bw * pct, 6);
  // border
  ctx.strokeStyle = '#3a2a1566';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, 6);
}

function drawParticles() {
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    if (p.type === 'text') {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.font = `bold ${p.size}px 'Cinzel', serif`;
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    } else if (p.type === 'glow') {
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      grad.addColorStop(0, p.color + Math.floor(alpha * 180).toString(16).padStart(2,'0'));
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  });
  ctx.textAlign = 'left';
}

// ── Main render loop ──────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  if (shakeTimer > 0) {
    ctx.translate(
      (Math.random() - 0.5) * shakeAmt,
      (Math.random() - 0.5) * shakeAmt
    );
  }

  drawArena();
  drawParticles();

  // Draw everything sorted by Y
  const drawables = [];
  drawables.push({ y: player.y + player.h, draw: () => drawCapybara(player) });
  enemies.forEach(e => {
    if (!e.dead) drawables.push({ y: e.y + e.h, draw: () => drawEnemy(e) });
  });
  drawables.sort((a,b) => a.y - b.y);
  drawables.forEach(d => d.draw());

  // Invincibility shimmer
  if (player.invincible > 0 && !player.isRolling && frameCount % 4 < 2) {
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = PAL.rollColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(player.x + player.w/2, player.y + player.h/2, player.w * 0.7, player.h * 0.65, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Stamina exhaustion indicator
  if (player.stamina < 20) {
    ctx.globalAlpha = 0.15 + Math.sin(frameCount * 0.2) * 0.1;
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(WALL_S, WALL_T, W - WALL_S * 2, H - WALL_T - WALL_B);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ── Start / Restart ───────────────────────────────────────
function startGame() {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game-wrap').style.display = 'block';
  initLevel();
  loop();
}

function restartGame() {
  initLevel();
}
</script>
